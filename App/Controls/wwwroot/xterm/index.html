<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>accel-terminal</title>
<link rel="stylesheet" href="https://accel-terminal/xterm.css" />
<style>
  /* Base (L0) black from App/Theme.xaml - must match TerminalView.xaml's Grid background and
     terminal.js's xterm theme, otherwise a lighter panel flashes before xterm paints. */
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0a; }
  /* No padding here on purpose: FitAddon derives the column/row count from this element's box,
     and the integer cell-metrics correction in terminal.js assumes it un-padded. */
  #term { width: 100%; height: 100%; position: relative; }
  /* The native scrollbar is collapsed in favour of #accel-scrollbar (terminal.js installScrollbar has
     the why: the native one is empty in the alternate screen Claude Code runs in, and was a thin
     low-contrast thumb elsewhere). scrollbar-width is standard and independent of the browser
     overlay-scrollbar flag; the ::-webkit rule covers older runtimes. The 14px FitAddon reserves on
     the right (addon-fit.js: overviewRuler?.width || 14) stays empty viewport background - that is
     where #accel-scrollbar sits, so the column count is unchanged and no cell is under the bar. */
  .xterm-viewport { scrollbar-width: none; }
  .xterm-viewport::-webkit-scrollbar { width: 0; height: 0; }
  #accel-scrollbar { position: absolute; top: 0; right: 0; bottom: 0; width: 14px; z-index: 20;
    background: #ffffff0f; user-select: none; touch-action: none; cursor: default; }
  #accel-scrollbar[hidden] { display: none; }
  #accel-scrollbar .thumb { position: absolute; left: 2px; right: 2px; min-height: 24px;
    border-radius: 5px; background: #a8a8a8; opacity: .8; }
  #accel-scrollbar:hover .thumb, #accel-scrollbar.dragging .thumb { left: 1px; right: 1px; background: #d0d0d0; opacity: 1; }
  #accel-scrollbar .arrow { position: absolute; left: 0; right: 0; height: 18px; display: none;
    color: #c2c2c2; font: 10px/18px "Segoe UI Symbol", sans-serif; text-align: center; background: #ffffff1a; }
  #accel-scrollbar .arrow:hover { background: #ffffff33; }
  #accel-scrollbar .arrow.up { top: 0; }
  #accel-scrollbar .arrow.down { bottom: 0; }
  #accel-scrollbar[data-mode="alt"] .thumb { display: none; }
  #accel-scrollbar[data-mode="alt"] .arrow { display: block; }
</style>
</head>
<body>
<!--
  P2-T5b: xterm.js wired to a live PtySession over /pty/{tabId}. All the attach/onData/resize
  glue lives in terminal.js (Accel's own script, not vendored - see THIRD_PARTY_NOTICES.txt for
  what is) so it can match Server/PtyRoutes.cs's binary-vs-text framing convention exactly.
  document.title is set by terminal.js on success/failure purely so a host (Program.cs's
  `terminal-e2e-smoke-test` dev verb) can prove via CoreWebView2.ExecuteScriptAsync that this page
  loaded and xterm.js initialized without a JS error, without needing a live screenshot or an
  attached devtools session.
-->
<div id="term">
  <div id="accel-scrollbar" hidden>
    <div class="thumb"></div>
    <div class="arrow up">&#x25B2;</div>
    <div class="arrow down">&#x25BC;</div>
  </div>
</div>
<script src="https://accel-terminal/xterm.js"></script>
<script src="https://accel-terminal/addon-fit.js"></script>
<script src="https://accel-terminal/addon-webgl.js"></script>
<!--
  ?v= is a manual cache-buster, not a build hash: WebView2's user-data folder
  (TerminalView.WebView2UserDataFolder) is persistent across app restarts, and
  SetVirtualHostNameToFolderMapping serves these files with a real Last-Modified
  header, which is enough for Chromium's HTTP disk cache to keep serving a stale
  terminal.js after this file is edited on disk - a plain rebuild/relaunch is not
  guaranteed to pick up the change. Bump this whenever terminal.js itself changes.
-->
<script src="https://accel-terminal/terminal.js?v=10"></script>
</body>
</html>
