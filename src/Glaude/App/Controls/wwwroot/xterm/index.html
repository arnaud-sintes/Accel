<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>glaude-terminal</title>
<link rel="stylesheet" href="https://glaude-terminal/xterm.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1e1e1e; }
  #term { width: 100%; height: 100%; }
</style>
</head>
<body>
<!--
  P2-T5b: xterm.js wired to a live PtySession over /pty/{tabId}. All the attach/onData/resize
  glue lives in terminal.js (Glaude's own script, not vendored - see THIRD_PARTY_NOTICES.txt for
  what is) so it can match Server/PtyRoutes.cs's binary-vs-text framing convention exactly.
  document.title is set by terminal.js on success/failure purely so a host (Program.cs's
  `ui-preview --verify` / `terminal-e2e-smoke-test`) can prove via
  CoreWebView2.ExecuteScriptAsync that this page loaded and xterm.js initialized without a JS
  error, without needing a live screenshot or an attached devtools session.
-->
<div id="term"></div>
<script src="https://glaude-terminal/xterm.js"></script>
<script src="https://glaude-terminal/addon-fit.js"></script>
<script src="https://glaude-terminal/terminal.js"></script>
</body>
</html>
