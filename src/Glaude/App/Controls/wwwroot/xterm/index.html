<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>glaude-terminal</title>
<link rel="stylesheet" href="https://glaude-terminal/xterm.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1e1e1e; }
  #term { width: 100%; height: 100%; }
</style>
</head>
<body>
<!--
  P2-T5: renders an inert xterm.js terminal - no PTY behind it yet (that is P2-T5b: attach,
  resize-over-the-wire, Ctrl+C, paste). document.title is set on success/failure below purely so
  a host (Program.cs's `ui-preview --verify`) can prove via CoreWebView2.ExecuteScriptAsync that
  this page actually loaded and xterm.js initialized without a JS error, without needing a live
  screenshot or an attached devtools session.
-->
<div id="term"></div>
<script src="https://glaude-terminal/xterm.js"></script>
<script src="https://glaude-terminal/addon-fit.js"></script>
<script>
  try {
    var term = new Terminal({ convertEol: true, fontFamily: "Cascadia Mono, Consolas, monospace" });
    var fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById("term"));
    term.write("Glaude terminal (P2-T5: rendering only, no PTY attached yet)\r\n");
    fitAddon.fit();
    window.addEventListener("resize", function () { fitAddon.fit(); });
    document.title = "glaude-terminal-ready";
  } catch (e) {
    document.title = "glaude-terminal-error:" + e.message;
  }
</script>
</body>
</html>
